name: Feed health check

on:
  # Runs before the Monday pipeline; fails (and notifies) if an active feed breaks.
  schedule:
    - cron: '0 20 * * 0'
  # Re-check whenever the feed configuration changes.
  push:
    paths:
      - 'pipeline/feeds.py'
      - 'pipeline/feed_check.py'
      - 'pipeline/ingestion.py'
      - '.github/workflows/feed_health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe feeds
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python pipeline/feed_check.py --strict
          else
            python pipeline/feed_check.py --discover
          fi
