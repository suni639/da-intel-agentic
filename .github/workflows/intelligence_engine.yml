name: Digital Asset Intelligence Engine Scheduled Run

on:
  schedule:
    # Run every Monday at 02:00 UTC (03:00 AM UK time during BST, 02:00 AM UK time during GMT)
    - cron: '0 2 * * 1'
  workflow_dispatch:
    # Allows manual execution from the GitHub Actions UI
    inputs:
      dry_run:
        description: 'Dry run: build the brief but skip email, Hugo push and state commit'
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main-repo

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: main-repo
          # Fetch all history so git push works cleanly
          fetch-depth: 0

      - name: Checkout Hugo repository
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: suni639/sunilkandola-hugo
          path: sunilkandola-hugo
          token: ${{ secrets.HUGO_REPO_PAT }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: main-repo/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check repository secrets
        run: |
          echo "Checking if secrets are populated (true/false):"
          echo "GEMINI_API_KEY is set: ${{ secrets.GEMINI_API_KEY != '' }}"
          echo "SMTP_USER is set: ${{ secrets.SMTP_USER != '' }}"
          echo "SMTP_PASS is set: ${{ secrets.SMTP_PASS != '' }}"
          echo "RECIPIENT_EMAIL is set: ${{ secrets.RECIPIENT_EMAIL != '' }}"
          echo "HUGO_REPO_PAT is set: ${{ secrets.HUGO_REPO_PAT != '' }}"

      - name: Run intelligence engine pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -o pipefail
          echo "Dry run flag: '${DRY_RUN_FLAG}'"
          python pipeline/run_pipeline.py $DRY_RUN_FLAG 2>&1 | tee pipeline_output.log

      - name: Show dry-run brief in job summary
        if: ${{ always() && inputs.dry_run }}
        run: |
          if [ -f pipeline/output_briefing.md ]; then
            { echo "# Dry-run brief"; echo; cat pipeline/output_briefing.md; } >> "$GITHUB_STEP_SUMMARY"
            cat pipeline/output_briefing.md
          else
            echo "No briefing was produced."
          fi

      - name: Commit and push updated system state
        # Only real runs on main may write state; a dispatch from a feature
        # branch would otherwise push that branch's commits to main.
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        run: |
          # Commit and push only if system_state.json exists and has changes
          if [ -f system_state.json ]; then
            echo "system_state.json found. Staging..."
            # Use force add because system_state.json is listed in .gitignore
            git add --force system_state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update system state [skip ci]"
              git push origin HEAD:main
            else
              echo "No changes to commit in system_state.json"
            fi
          else
            echo "system_state.json does not exist. Skipping commit."
          fi

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            main-repo/pipeline_output.log
            main-repo/error_log.txt
            main-repo/pipeline/output_briefing.md
            main-repo/shared_artifacts/strategic_analysis.json
